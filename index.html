<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>排隊大師 - Flexbox 網頁遊戲 </title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Microsoft JhengHei", sans-serif;
        }

        body {
            height: 100vh;
            background-color: #f0f2f5;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ==================================================
           【開場首頁圖層】
           ================================================== */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #2c3e50, #1a252f);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease, visibility 0.5s ease;
            text-align: center;
            padding: 20px;
        }

        .welcome-title {
            font-size: 48px;
            color: #f1c40f;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .welcome-emoji-group {
            font-size: 60px;
            margin-bottom: 30px;
            animation: bounce 2s infinite alternate;
        }

        @keyframes bounce {
            0% {
                transform: translateY(0);
            }

            100% {
                transform: translateY(-15px);
            }
        }

        .welcome-desc {
            font-size: 20px;
            max-width: 600px;
            line-height: 1.8;
            margin-bottom: 40px;
            color: #bdc3c7;
        }

        .start-btn {
            padding: 15px 40px;
            font-size: 22px;
            font-weight: bold;
            color: #fff;
            background-color: #e67e22;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(230, 126, 34, 0.4);
            transition: all 0.2s ease;
        }

        .start-btn:hover {
            background-color: #d35400;
            transform: scale(1.05);
        }

        /* ==================================================
           【主要遊戲畫面佈局】
           ================================================== */
        #main-game {
            display: flex;
            width: 100vw;
            height: 100vh;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        /* 左邊控制區 */
        #left-panel {
            width: 450px;
            background-color: #2c3e50;
            color: #ecf0f1;
            padding: 25px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 5px 0 15px rgba(0, 0, 0, 0.15);
            z-index: 10;
        }

        /* 1. 遊戲標題列 */
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #34495e;
            padding-bottom: 15px;
        }

        .game-logo {
            font-size: 24px;
            color: #f1c40f;
            font-weight: bold;
        }

        .level-switcher {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-btn {
            background-color: #34495e;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .nav-btn:hover {
            background-color: #4e6a85;
        }

        #level-indicator {
            font-size: 16px;
            font-weight: bold;
            color: #e67e22;
        }

        /* 2. 關卡說明 */
        .instruction-box {
            background-color: #34495e;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            line-height: 1.6;
            font-size: 16px;
            border-left: 5px solid #2ecc71;
        }

        /* 3. 屬性提示區 */
        .hint-box {
            background-color: #2980b9;
            color: white;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
            line-height: 1.5;
        }

        .hint-box code {
            background-color: rgba(0, 0, 0, 0.2);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
        }

        /* 4. CSS 輸入編輯器 */
        .editor-container {
            background-color: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', Courier, monospace;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
        }

        .css-prefix {
            color: #569cd6;
            font-size: 15px;
        }

        textarea {
            width: 100%;
            flex-grow: 1;
            background: transparent;
            border: none;
            color: #9cdcfe;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            resize: none;
            outline: none;
            line-height: 1.6;
            margin-top: 5px;
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 來去下一攤按鈕樣式 */
        #submit-btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        #submit-btn:hover:not(:disabled) {
            background-color: #27ae60;
        }

        /* 停用狀態 (灰色) */
        #submit-btn:disabled {
            background-color: #7f8c8d;
            color: #bdc3c7;
            cursor: not-allowed;
            opacity: 0.6;
        }

        /* 成功通關倒數狀態 (亮綠色+呼吸動效) */
        #submit-btn.success-countdown {
            background-color: #2ecc71;
            color: white;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.03);
            }

            100% {
                transform: scale(1);
            }
        }

        /* 5. 版權說明 */
        .footer-copyright {
            text-align: center;
            font-size: 12px;
            color: #7f8c8d;
            margin-top: 15px;
            border-top: 1px solid #34495e;
            padding-top: 10px;
        }


        /* ==================================================
           【右邊遊戲畫布區】
           ================================================== */
        #game-area {
            flex: 1;
            padding: 20px;
            background-color: #eef2f3;
            height: 100%;
        }

        #game-container {
            width: 100%;
            height: 100%;
            position: relative;
            background-color: #dfe6e9;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.05);
        }

        /* 圖層1: 固定店家 */
        #store-layer {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 20px;
            display: flex;
            pointer-events: none;
            z-index: 10;
        }

        .store {
            width: 100px;
            height: 100px;
            background-color: #e74c3c;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            border: 3px solid #fff;
            text-align: center;
            font-size: 15px;
        }

        /* 圖層2: 目標排隊位置 (純影子) */
        #target-pond {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 20px;
            display: flex;
            z-index: 2;
        }

        /* 圖層3: 玩家操作隊伍 (純活體客人) */
        #player-queue {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 20px;
            display: flex;
            z-index: 3;
            pointer-events: none;
            transition: all 0.2s ease;
            /* 讓玩家微調時移動更滑順 */
        }

        /* ==================================================
           【🙋 客人角色與分色影子樣式】
           ================================================== */
        .person {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 5px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
            transition: all 0.3s ease;
            border: 3px solid #ffffff;
        }

        .person.student {
            background-color: #3498db;
        }

        .person.male {
            background-color: #7f8c8d;
        }

        .person.female {
            background-color: #fd79a8;
        }

        .person-shadow {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 5px;
            opacity: 0.4;
            background-color: rgba(255, 255, 255, 0.6);
            transition: all 0.3s ease;
        }

        .person-shadow.student-shadow {
            border: 4px dashed #3498db;
        }

        .person-shadow.male-shadow {
            border: 4px dashed #7f8c8d;
        }

        .person-shadow.female-shadow {
            border: 4px dashed #fd79a8;
        }
    </style>
</head>

<body>

    <!-- 開場首頁 -->
    <div id="welcome-screen">
        <h1 class="welcome-title">🙋‍♂️ 排隊大師 🙋‍♀️</h1>
        <div class="welcome-emoji-group">🙋🙋‍♂️🙋‍♀️ 🏪 🧋</div>
        <p class="welcome-desc">
            終於來到夜市了！這裡有好多美味的排隊名店。<br>
            請使用 <strong>Flexbox</strong> 技巧，根據店家的突發公告與排隊指示，引導飢餓的客人們排好隊伍吧！
        </p>
        <button class="start-btn" onclick="startGame()">成為排隊大師</button>
    </div>

    <!-- 主要遊戲畫面 -->
    <div id="main-game">
        <div id="left-panel">
            <div>
                <div class="panel-header">
                    <div class="game-logo">🙋 排隊大師</div>
                    <div class="level-switcher">
                        <button class="nav-btn" onclick="prevLevel()">&lt;</button>
                        <span id="level-indicator">關卡 1 / 12</span>
                        <button class="nav-btn" onclick="nextLevel()">&gt;</button>
                    </div>
                </div>

                <div class="instruction-box" id="instruction-text">載入中...</div>

                <div class="hint-box" id="hint-text">提示屬性載入中...</div>

                <div class="editor-container">
                    <div class="css-prefix">#night-market-queue {</div>
                    <div class="css-prefix">&nbsp;&nbsp;display: flex;</div>
                    <textarea id="code-input" placeholder="/* 在此輸入 Flexbox 語法 */justify-content: ...;"
                        autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
                    <div class="css-prefix">}</div>
                </div>
            </div>

            <div class="action-bar">
                <button onclick="resetLevel()"
                    style="background-color: #e74c3c; color: white; border:none; padding:10px 15px; border-radius:5px; cursor:pointer; font-weight:bold;">重填</button>
                <button id="submit-btn" disabled>來去下一攤</button>
            </div>

            <div class="footer-copyright">&copy; 2026 排隊大師 版權所有</div>
        </div>

        <div id="game-area">
            <div id="game-container">
                <div id="store-layer"></div>
                <div id="target-pond"></div>
                <div id="player-queue"></div>
            </div>
        </div>
    </div>

    <script>
        const levels = [
            {
                id: 1,
                instruction: "【大腸包小腸】攤位在最右邊。老闆大喊：『請大家全部往右邊靠攏排成一列，別擋住隔壁攤位！』",
                hint: "本關需要使用：<code>justify-content</code>。<br>可選值：<code>flex-start</code> | <code>center</code> | <code>flex-end</code> 等。",
                storeStyle: "justify-content: flex-end; align-items: center;",
                storeHtml: `<div class="store">大腸包小腸</div>`,
                targetStyle: "justify-content: flex-end; align-items: center; padding-right: 125px;",
                htmlContent: `<div class="person-shadow student-shadow">🙋</div><div class="person-shadow male-shadow">🙋‍♂️</div><div class="person-shadow female-shadow">🙋‍♀️</div>`,
                playerContent: `<div class="person student">🙋</div><div class="person male">🙋‍♂️</div><div class="person female">🙋‍♀️</div>`,
                playerPaddingHint: "padding-right: 125px;"
            },
            {
                id: 2,
                instruction: "【阿宗麵線】在最上方正中間。店員大喊：『請大家配合在中間集合排隊！』",
                hint: "本關需要使用：<code>justify-content</code> 達成水平置中對齊。",
                storeStyle: "justify-content: center;",
                storeHtml: `<div class="store">阿宗麵線</div>`,
                targetStyle: "justify-content: center; align-items: flex-start; padding-top: 125px;",
                htmlContent: `<div class="person-shadow female-shadow">🙋‍♀️</div><div class="person-shadow male-shadow">🙋‍♂️</div>`,
                playerContent: `<div class="person female">🙋‍♀️</div><div class="person male">🙋‍♂️</div>`,
                playerPaddingHint: "padding-top: 125px;"
            },
            {
                id: 3,
                instruction: "【地瓜球名店】位於最下方。請由下往上『垂直反向』排隊（讓🙋‍♂️在最下層靠近店面）。",
                hint: "本關需要同時調整軸線與對齊：<code>flex-direction</code> 與 <code>justify-content</code>。",
                storeStyle: "justify-content: center; align-items: flex-end;",
                storeHtml: `<div class="store">地瓜球</div>`,
                targetStyle: "flex-direction: column-reverse; justify-content: flex-start; align-items: center; padding-bottom: 125px;",
                htmlContent: `<div class="person-shadow male-shadow">🙋‍♂️</div><div class="person-shadow female-shadow">🙋‍♀️</div><div class="person-shadow student-shadow">🙋</div>`,
                playerContent: `<div class="person male">🙋‍♂️</div><div class="person female">🙋‍♀️</div><div class="person student">🙋</div>`,
                playerPaddingHint: "padding-bottom: 125px;"
            }
        ];

        let currentLevelIndex = 0;
        const totalLevels = 12;
        let checkInterval = null;
        let countdownTimer = null;
        let isPassed = false; // 用於防止重複觸發倒數

        function startGame() {
            document.getElementById('welcome-screen').style.opacity = '0';
            document.getElementById('welcome-screen').style.visibility = 'hidden';
            document.getElementById('main-game').style.opacity = '1';
            loadLevel(currentLevelIndex);

            // 綁定鍵盤輸入事件，達成即時畫面同步
            document.getElementById('code-input').addEventListener('input', updateLivePreview);

            // 啟動高頻即時偵測器 (每 100ms 檢查一次是否過關)
            if (checkInterval) clearInterval(checkInterval);
            checkInterval = setInterval(autoCheckPosition, 100);
        }

        function loadLevel(index) {
            if (index >= levels.length) {
                alert("感謝遊玩！後續關卡題目解鎖中！");
                currentLevelIndex = levels.length - 1;
                return;
            }

            // 重設關卡變數與按鈕狀態
            isPassed = false;
            if (countdownTimer) clearInterval(countdownTimer);

            const btn = document.getElementById('submit-btn');
            btn.innerText = "來去下一攤";
            btn.disabled = true;
            btn.classList.remove('success-countdown');

            const textarea = document.getElementById('code-input');
            textarea.disabled = false;
            textarea.value = "";

            const level = levels[index];
            document.getElementById('level-indicator').innerText = `關卡 ${level.id} / ${totalLevels}`;
            document.getElementById('instruction-text').innerHTML = level.instruction;
            document.getElementById('hint-text').innerHTML = level.hint;

            document.getElementById('store-layer').style.cssText = level.storeStyle;
            document.getElementById('store-layer').innerHTML = level.storeHtml;
            document.getElementById('target-pond').style.cssText = level.targetStyle;
            document.getElementById('target-pond').innerHTML = level.htmlContent;

            const playerQueue = document.getElementById('player-queue');
            playerQueue.innerHTML = level.playerContent;
            playerQueue.style.cssText = level.playerPaddingHint;
        }

        // 【即時同步】把玩家打的字立刻灌進 Canvas
        function updateLivePreview() {
            if (isPassed) return; // 過關後鎖定
            const currentLevel = levels[currentLevelIndex];
            const playerStyle = document.getElementById('code-input').value;
            const playerQueue = document.getElementById('player-queue');
            playerQueue.style.cssText = currentLevel.playerPaddingHint + ";" + playerStyle;
        }

        // 【自動幾何位置校對】
        function autoCheckPosition() {
            if (isPassed) return;

            const playerQueue = document.getElementById('player-queue');
            const targetPond = document.getElementById('target-pond');
            const pPeople = playerQueue.querySelectorAll('.person');
            const tShadows = targetPond.querySelectorAll('.person-shadow');

            if (pPeople.length === 0 || tShadows.length === 0) return;

            let isAllCorrect = true;

            pPeople.forEach((person, i) => {
                if (tShadows[i]) {
                    const pRect = person.getBoundingClientRect();
                    const sRect = tShadows[i].getBoundingClientRect();

                    // 誤差值判定範圍提至 8px 提高極限操作下的容錯
                    if (Math.abs(pRect.left - sRect.left) > 8 || Math.abs(pRect.top - sRect.top) > 8) {
                        isAllCorrect = false;
                    }
                } else {
                    isAllCorrect = false;
                }
            });

            // 觸發成功排對條件
            if (isAllCorrect) {
                triggerSuccessCountdown();
            }
        }

        // 【倒數 3 秒進下一關機制】
        function triggerSuccessCountdown() {
            isPassed = true; // 鎖定狀態防止重複計時
            document.getElementById('code-input').disabled = true; // 答對後鎖定代碼輸入

            const btn = document.getElementById('submit-btn');
            btn.disabled = false;
            btn.classList.add('success-countdown');

            let secondsLeft = 3;
            btn.innerText = `來去下一攤 (${secondsLeft}s)`;

            countdownTimer = setInterval(() => {
                secondsLeft--;
                if (secondsLeft <= 0) {
                    clearInterval(countdownTimer);

                    // 前進下一關
                    if (currentLevelIndex < levels.length - 1) {
                        currentLevelIndex++;
                        loadLevel(currentLevelIndex);
                    } else {
                        btn.innerText = "全關卡破關！";
                        alert("🎉 恭喜！你已經完成了目前釋出的所有排隊試煉！成為排隊大師!!!");
                    }
                } else {
                    btn.innerText = `來去下一攤 (${secondsLeft}s)`;
                }
            }, 1000);
        }

        function prevLevel() { if (currentLevelIndex > 0) { currentLevelIndex--; loadLevel(currentLevelIndex); } }
        function nextLevel() { if (currentLevelIndex < levels.length - 1) { currentLevelIndex++; loadLevel(currentLevelIndex); } }
        function resetLevel() { loadLevel(currentLevelIndex); }
    </script>
</body>

</html>
